version: "{branch}.{build}"

branches:
  only:
    - master
    - develop

image: Visual Studio 2022

environment:
  matrix:
    - CMAKE_ARCH: Win32
      VCPKG_DEFAULT_TRIPLET: x86-windows
    - CMAKE_ARCH: x64
      VCPKG_DEFAULT_TRIPLET: x64-windows

install:
  - ps: |
      $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
      if ($baseline -notmatch '^[0-9a-f]{40}$') {
        throw "Invalid vcpkg builtin baseline: $baseline"
      }
      git -C C:\tools\vcpkg fetch --no-tags origin $baseline
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to fetch vcpkg baseline $baseline"
      }
      git -C C:\tools\vcpkg cat-file -e "${baseline}:versions/baseline.json"
      if ($LASTEXITCODE -ne 0) {
        throw "Fetched baseline does not contain versions/baseline.json: $baseline"
      }
      git -C C:\tools\vcpkg checkout --detach --force $baseline
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to check out vcpkg baseline $baseline"
      }
      & C:\tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      if ($LASTEXITCODE -ne 0) {
        throw "Failed to bootstrap vcpkg at baseline $baseline"
      }
  - >-
    C:\tools\vcpkg\vcpkg.exe install
    --triplet %VCPKG_DEFAULT_TRIPLET%
    --x-install-root=%APPVEYOR_BUILD_FOLDER%\vcpkg_installed

build_script:
  - >-
    cmake -S . -B build
    -A %CMAKE_ARCH%
    -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_INSTALL_PREFIX=%APPVEYOR_BUILD_FOLDER%\artifacts
    -DCMAKE_TOOLCHAIN_FILE=C:\tools\vcpkg\scripts\buildsystems\vcpkg.cmake
    -DVCPKG_INSTALLED_DIR=%APPVEYOR_BUILD_FOLDER%\vcpkg_installed
    -DVCPKG_TARGET_TRIPLET=%VCPKG_DEFAULT_TRIPLET%
    -DVCPKG_MANIFEST_MODE=ON
    -DMUSTACHE_WARNINGS_AS_ERRORS=ON
  - cmake --build build --config Release --parallel
  - cmake --install build --config Release
  - copy /Y vcpkg_installed\%VCPKG_DEFAULT_TRIPLET%\bin\*.dll artifacts\bin\

test_script:
  - ctest --test-dir build -C Release --output-on-failure
  - set PATH=%APPVEYOR_BUILD_FOLDER%\artifacts\bin;%PATH%
  - artifacts\bin\mustachec.exe -v
  - >-
    cmake -S tests/cmake-consumer -B consumer-shared
    -A %CMAKE_ARCH%
    -DCMAKE_PREFIX_PATH=%APPVEYOR_BUILD_FOLDER%\artifacts
    -DCMAKE_TOOLCHAIN_FILE=C:\tools\vcpkg\scripts\buildsystems\vcpkg.cmake
    -DVCPKG_INSTALLED_DIR=%APPVEYOR_BUILD_FOLDER%\vcpkg_installed
    -DVCPKG_TARGET_TRIPLET=%VCPKG_DEFAULT_TRIPLET%
    -DVCPKG_MANIFEST_MODE=OFF
  - cmake --build consumer-shared --config Release --parallel
  - consumer-shared\Release\mustache_consumer.exe
  - >-
    cmake -S tests/cmake-consumer -B consumer-static
    -A %CMAKE_ARCH%
    -DCMAKE_PREFIX_PATH=%APPVEYOR_BUILD_FOLDER%\artifacts
    -DCMAKE_TOOLCHAIN_FILE=C:\tools\vcpkg\scripts\buildsystems\vcpkg.cmake
    -DVCPKG_INSTALLED_DIR=%APPVEYOR_BUILD_FOLDER%\vcpkg_installed
    -DVCPKG_TARGET_TRIPLET=%VCPKG_DEFAULT_TRIPLET%
    -DVCPKG_MANIFEST_MODE=OFF
    -DMUSTACHE_CONSUMER_LINKAGE=static
  - cmake --build consumer-static --config Release --parallel
  - consumer-static\Release\mustache_consumer.exe

artifacts:
  - path: artifacts
    name: libmustache
    type: zip
