name: release

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Windows (${{ matrix.architecture }}, ${{ matrix.toolset }}, ${{ matrix.linkage }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
        toolset: [v142, v143]
        linkage: [static, shared]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check build metadata
        shell: bash
        run: ./scripts/check-version-consistency.sh

      - name: Test packaging and publishing rules
        run: python tests/test_release.py

      - name: Build, test, and package
        shell: pwsh
        run: >-
          ./.github/scripts/build-windows.ps1
          -Architecture '${{ matrix.architecture }}'
          -Toolset '${{ matrix.toolset }}'
          -Linkage '${{ matrix.linkage }}'
          -WorkDirectory "$env:RUNNER_TEMP/libmustache-windows"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-windows-${{ matrix.architecture }}-${{ matrix.toolset }}-${{ matrix.linkage }}
          path: |
            ${{ runner.temp }}/libmustache-windows/archives/*.zip
            ${{ runner.temp }}/libmustache-windows/archives/*.sha256
          if-no-files-found: error

      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-tests-${{ matrix.architecture }}-${{ matrix.toolset }}-${{ matrix.linkage }}
          path: |
            ${{ runner.temp }}/libmustache-windows/build/ctest-results.xml
            ${{ runner.temp }}/libmustache-windows/build/ctest-output.log
          if-no-files-found: ignore

  unix:
    name: Unix (${{ matrix.platform }}, ${{ matrix.linkage }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-glibc
            runner: ubuntu-24.04
            linkage: static
          - platform: linux-x64-glibc
            runner: ubuntu-24.04
            linkage: shared
          - platform: linux-x64-musl
            runner: ubuntu-24.04
            linkage: static
          - platform: macos-aarch64
            runner: macos-15
            linkage: static
          - platform: macos-aarch64
            runner: macos-15
            linkage: shared
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check build metadata
        shell: bash
        run: |
          ./scripts/check-version-consistency.sh
          version=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["version-string"])')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Share Nix build cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-release-${{ matrix.platform }}-${{ matrix.linkage }}-${{ github.sha }}
          restore-prefixes-first-match: nix-store-v1-${{ runner.os }}-${{ runner.arch }}-
          restore-prefixes-all-matches: nix-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-

      - name: Build, test, and package with Nix
        shell: bash
        run: |
          nix build --print-build-logs --cores 2 --max-jobs 2 \
            --out-link "$RUNNER_TEMP/unix-release" \
            '.#release-${{ matrix.platform }}-${{ matrix.linkage }}'
          mkdir -p "$RUNNER_TEMP/unix-artifacts"
          cp "$RUNNER_TEMP/unix-release/"* "$RUNNER_TEMP/unix-artifacts/"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.platform }}-${{ matrix.linkage }}
          path: ${{ runner.temp }}/unix-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [build, unix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publishing script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download tested packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-package-*
          merge-multiple: true
          path: release-artifacts

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["version-string"])')" >> "$GITHUB_OUTPUT"

      - name: Validate complete release assets
        run: python3 .github/scripts/publish-release.py validate release-artifacts '${{ steps.version.outputs.version }}'

      - name: Publish only for a version tag push
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py publish release-artifacts
