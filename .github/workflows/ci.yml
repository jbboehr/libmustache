name: ci

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build metadata consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check version and ABI metadata
        run: ./scripts/check-version-consistency.sh

  autotools:
    name: Autotools (${{ matrix.os }}, ${{ matrix.compiler.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
            package: g++
          - name: Clang
            cc: clang
            cxx: clang++
            package: clang
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      MUSTACHE_TEST_NUMERIC_LOCALE: de_DE.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            "${{ matrix.compiler.package }}" \
            autoconf \
            automake \
            nlohmann-json3-dev \
            libtool \
            libyaml-dev \
            locales \
            m4 \
            make \
            pkg-config
          sudo locale-gen de_DE.UTF-8

      - name: Generate configure script
        run: autoreconf --force --install --verbose

      - name: Configure
        run: |
          mkdir build-autotools
          cd build-autotools
          ../configure \
            --prefix="$RUNNER_TEMP/libmustache" \
            --enable-warnings-as-errors

      - name: Build and test
        working-directory: build-autotools
        run: |
          make --jobs="$(nproc)"
          if ! make check; then
            find tests -type f -name '*.log' -print -exec cat {} \;
            exit 1
          fi
          make install

      - name: Verify installed command
        run: |
          "$RUNNER_TEMP/libmustache/bin/mustachec" -v
          rendered=$("$RUNNER_TEMP/libmustache/bin/mustachec" \
            -t tests/fixtures/standard.mustache \
            -d tests/fixtures/standard.json)
          test -n "$rendered"

      - name: Verify private JSON symbols
        run: |
          shared_library="$RUNNER_TEMP/libmustache/lib/libmustache.so"
          static_library="$RUNNER_TEMP/libmustache/lib/libmustache.a"
          exported_json_symbols=$(nm -D --defined-only "$shared_library" |
            c++filt |
            grep -E 'nlohmann|JSONDataBuilder|Data::parseJSON|Data::parsedFloating' || true)
          test -z "$exported_json_symbols"
          visible_static_json_symbols=$(readelf --syms --wide "$static_library" |
            c++filt |
            awk '$5 ~ /^(GLOBAL|WEAK)$/ && $6 != "HIDDEN" &&
              /nlohmann|JSONDataBuilder|Data::parseJSON|Data::parsedFloating/ {
                print
              }')
          test -z "$visible_static_json_symbols"

      - name: Verify distribution archive
        working-directory: build-autotools
        run: make distcheck

      - name: Upload Autotools failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autotools-failure-logs-${{ matrix.os }}-${{ matrix.compiler.name }}
          path: |
            build-autotools/**/config.log
            build-autotools/**/tests/*.log
          if-no-files-found: ignore
          retention-days: 14

  cmake:
    name: CMake (${{ matrix.compiler.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
            package: g++
          - name: Clang
            cc: clang
            cxx: clang++
            package: clang
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            "${{ matrix.compiler.package }}" \
            cmake \
            nlohmann-json3-dev \
            libyaml-dev \
            ninja-build \
            pkg-config

      - name: Configure, build, and test
        run: |
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libmustache" \
            -DMUSTACHE_WARNINGS_AS_ERRORS=ON
          cmake --build build-cmake --parallel
          ctest --test-dir build-cmake \
            --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build-cmake/ctest-results.xml" \
            --output-log "$GITHUB_WORKSPACE/build-cmake/ctest-output.log"
          cmake --install build-cmake

          cmake -S tests/cmake-subproject -B build-subproject -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-subproject --parallel
          build-subproject/mustache_subproject_consumer

      - name: Verify installed package
        run: |
          "$RUNNER_TEMP/libmustache/bin/mustachec" -v

          cmake -S tests/cmake-consumer -B build-consumer-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libmustache"
          cmake --build build-consumer-shared --parallel
          build-consumer-shared/mustache_consumer

          cmake -S tests/cmake-consumer -B build-consumer-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libmustache" \
            -DMUSTACHE_CONSUMER_LINKAGE=static
          cmake --build build-consumer-static --parallel
          build-consumer-static/mustache_consumer

          cmake -S tests/cmake-find-quiet -B build-find-quiet -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libmustache"

          export PKG_CONFIG_PATH="$RUNNER_TEMP/libmustache/lib/pkgconfig"
          pkg_version=$(pkg-config --modversion mustache)
          read -r -a pkg_config_flags <<< "$(pkg-config --cflags --libs mustache)"
          "$CXX" -std=c++11 tests/cmake-consumer/main.cpp \
            "-DMUSTACHE_EXPECTED_VERSION=\"$pkg_version\"" \
            "${pkg_config_flags[@]}" \
            -o pkg-config-consumer
          LD_LIBRARY_PATH="$RUNNER_TEMP/libmustache/lib" ./pkg-config-consumer

      - name: Upload CTest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctest-linux-${{ matrix.compiler.name }}
          path: |
            build-cmake/ctest-results.xml
            build-cmake/ctest-output.log
          if-no-files-found: warn
          retention-days: 14

  cmake-macos:
    name: CMake (macOS, AppleClang)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: brew install nlohmann-json libyaml ninja pkg-config

      - name: Configure, build, test, and install
        run: |
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libmustache" \
            -DMUSTACHE_ENABLE_ARCHIVED_TEMPLATES=ON \
            -DMUSTACHE_WARNINGS_AS_ERRORS=ON
          cmake --build build-cmake --parallel
          ctest --test-dir build-cmake \
            --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build-cmake/ctest-results.xml" \
            --output-log "$GITHUB_WORKSPACE/build-cmake/ctest-output.log"
          cmake --install build-cmake

      - name: Verify installed shared and static packages
        run: |
          "$RUNNER_TEMP/libmustache/bin/mustachec" -v

          cmake -S tests/cmake-consumer -B build-consumer-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libmustache"
          cmake --build build-consumer-shared --parallel
          build-consumer-shared/mustache_consumer

          cmake -S tests/cmake-consumer -B build-consumer-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libmustache" \
            -DMUSTACHE_CONSUMER_LINKAGE=static
          cmake --build build-consumer-static --parallel
          build-consumer-static/mustache_consumer

          cmake -S tests/cmake-find-quiet -B build-find-quiet -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/libmustache"

      - name: Upload CTest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctest-macos-AppleClang
          path: |
            build-cmake/ctest-results.xml
            build-cmake/ctest-output.log
          if-no-files-found: warn
          retention-days: 14

  sanitizers:
    name: Sanitizers (${{ matrix.compiler.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
            package: g++
          - name: Clang
            cc: clang
            cxx: clang++
            package: clang
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            "${{ matrix.compiler.package }}" \
            autoconf \
            automake \
            cmake \
            nlohmann-json3-dev \
            libtool \
            libyaml-dev \
            m4 \
            make \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Build and test with sanitizers
        run: |
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMUSTACHE_ENABLE_SANITIZERS=ON \
            -DMUSTACHE_WARNINGS_AS_ERRORS=ON \
            -DMUSTACHE_ENABLE_FUZZING=${{ matrix.compiler.name == 'Clang' && 'ON' || 'OFF' }} \
            -DMUSTACHE_ENABLE_ARCHIVED_TEMPLATES=${{ matrix.compiler.name == 'Clang' && 'ON' || 'OFF' }}
          cmake --build build-sanitized --parallel
          ctest --test-dir build-sanitized \
            --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build-sanitized/ctest-results.xml" \
            --output-log "$GITHUB_WORKSPACE/build-sanitized/ctest-output.log"

          autoreconf --force --install --verbose
          mkdir build-sanitized-autotools
          cd build-sanitized-autotools
          ../configure \
            --enable-sanitizers \
            --enable-warnings-as-errors
          make --jobs="$(nproc)"
          make check

      - name: Upload sanitizer CTest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-ctest-results-${{ matrix.compiler.name }}
          path: |
            build-sanitized/ctest-results.xml
            build-sanitized/ctest-output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sanitizer Autotools failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-autotools-failure-logs-${{ matrix.compiler.name }}
          path: |
            build-sanitized-autotools/config.log
            build-sanitized-autotools/tests/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload sanitizer fuzz reproducers
        if: ${{ !cancelled() && matrix.compiler.name == 'Clang' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-fuzz-reproducers-${{ matrix.compiler.name }}
          path: build-sanitized/tests/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  nix-matrix:
    name: Generate Nix matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - id: set-matrix
        name: Generate matrix
        run: |
          set -Eeu
          matrix=$(nix eval --json '.#githubActions.matrix')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix:
    name: Nix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: nix-matrix
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Build check
        run: nix build --print-build-logs ".#${{ matrix.attr }}"
